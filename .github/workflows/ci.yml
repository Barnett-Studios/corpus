name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  attribution:
    name: attribution-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck verify-attribution.sh
      - name: MANIFEST.tsv matches the corpus data
        run: ./verify-attribution.sh --check
