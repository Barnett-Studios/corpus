name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable). No Dependabot.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: shellcheck the manifest tool
        run: shellcheck verify-attribution.sh
      # In the standalone repo the node data lives at red-baseline/; --check fails
      # (non-zero) if MANIFEST.tsv has drifted from what is actually shipped.
      - name: attribution manifest matches the data
        run: CORPUS_ROOT=red-baseline ./verify-attribution.sh --check

  accept-oracle:
    name: accept-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable). ubuntu-latest ships
      # go/cargo/javac/java/python3 on PATH; the scripts fail-open per missing tool (checks A and D
      # — the CONTRACT invariants — need no toolchain at all).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The scripts fail-open per absent tool (so they run anywhere), but in CI we REQUIRE the full
      # set — otherwise checks B/C would silently skip and the integrity gate would weaken to green.
      - name: require all toolchains (fail the build if any is missing)
        run: |
          missing=0
          for t in go cargo javac java python3 shellcheck; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%s: %s\n' "$t" "$(command -v "$t")"
            else
              printf '%s: MISSING\n' "$t"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "a required toolchain is absent on the runner" >&2; exit 1; }
      - name: shellcheck the oracle scripts
        run: shellcheck ci/verify-accept-oracle.sh ci/prove-solvable.sh ci/verify-oracle-sabotage.sh
      - name: accept-oracle invariant (exit-code oracle + no editable test)
        run: CORPUS_ROOT=red-baseline bash ci/verify-accept-oracle.sh
      - name: oracle-sabotage invariant (in-process sabotage cannot score GREEN)
        run: CORPUS_ROOT=red-baseline bash ci/verify-oracle-sabotage.sh
      - name: GREEN spot-check (reference solutions stay solvable)
        run: CORPUS_ROOT=red-baseline bash ci/prove-solvable.sh
      - name: RED-invariant checker self-test (the guard must bite)
        run: bash ci/verify-red-invariant.sh --self-test

  # corpus#26 — the census's own controls. Two separate things, deliberately in one job
  # because both are seconds and neither needs a toolchain:
  #
  #   1. the census scripts' completeness guards are themselves exercised (`spec.py`'s
  #      self-test), so a guard that has stopped guarding is caught here rather than the
  #      next time someone re-runs the census;
  #   2. the committed `docs/census/validity-census.tsv` still describes THIS tree.
  #
  # Note what (2) is not. #26 proposed re-running stage 2 and diffing, but `classify.py`
  # reads `.census-work/`, which is gitignored — nothing in the repo can reproduce the
  # classification without first re-running the 250-node stage-1 sweep. `census-inputs.py`
  # checks the property that actually matters instead: the inputs the census was computed
  # over are unchanged, so the verdicts still apply. See its module docstring.
  census:
    name: census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: census guards bite (spec.py self-test)
        run: python3 ci/census/spec.py --self-test
      - name: the committed census still describes this tree
        run: python3 ci/census/census-inputs.py

  # corpus#3 — the RED invariant: every node must ship FAILING. A node that drifts to
  # GREEN is a free point for both arms of every A/B, silently inflating solve-rate.
  #
  # Sharded by language because the cost is wildly uneven — go/python/rust finish in
  # minutes, gradle and npm-install nodes do not — and a single job would be paced by the
  # slowest toolchain. Each shard is independent, so one slow language cannot mask another.
  # `fail-fast: false` so a failure in one language still reports the others: the useful
  # output is the FULL list of GREEN nodes, not the first one.
  red-invariant:
    name: red-invariant (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, rust, cpp, java, javascript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The sweep fails LOUD rather than skipping: a shard whose toolchain is missing
      # would otherwise report a green sweep over nothing (the script's vacuity guard
      # exits 2, but requiring the tool here names the cause).
      - name: require this shard's toolchain
        run: |
          case "${{ matrix.language }}" in
            python) t=python3 ;; go) t=go ;; rust) t=cargo ;;
            cpp) t=cmake ;; java) t=javac ;; javascript) t=npm ;;
          esac
          command -v "$t" >/dev/null 2>&1 || { echo "$t missing on the runner" >&2; exit 1; }
      - name: every ${{ matrix.language }} node is RED at HEAD
        run: CORPUS_ROOT=red-baseline CORPUS_LANG=${{ matrix.language }} bash ci/verify-red-invariant.sh
